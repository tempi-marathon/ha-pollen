[tool.ruff]
target-version = "py312"
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # bugbear
  "SIM", # simplify
]
ignore = [
  "SIM114",  # combining if/elif with or hurts readability for tie-breaks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
